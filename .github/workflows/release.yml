name: Release

# Publishing happens ONLY when a version tag (e.g. v0.2.0) is pushed.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  verify:
    name: Verify tag & release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must point at a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Resolve version and check release notes
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          NOTES="release-notes/$VERSION.md"
          [ -f "$NOTES" ] || { echo "::error::Missing $NOTES"; exit 1; }
          cmp -s RELEASE_NOTES.md "$NOTES" \
            || { echo "::error::RELEASE_NOTES.md must match $NOTES"; exit 1; }

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - run: pytest tests/test_runapi.py

  build:
    name: Build distribution
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Built version must match tag
        run: |
          EXPECTED="${{ needs.verify.outputs.version }}"
          ls dist/
          ls dist/ | grep -q "runapi-$EXPECTED" \
            || { echo "::error::Built artifacts do not match tag version $EXPECTED"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [verify, publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.verify.outputs.version }}
          body_path: release-notes/${{ needs.verify.outputs.version }}.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: dist/*
