[project]
name = "runapi"
dynamic = ["version"]
description = "A Next.js-inspired file-based routing framework built on FastAPI"
readme = "README.md"
authors = [{ name = "Amanpreet Singh", email = "amanpreetsinghjhiwant7@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "bcrypt>=4.0.1",
    "PyJWT>=2.10.1",
    "python-multipart>=0.0.18",
    "aiofiles>=23.2.1",
    "psutil>=6.0.0",
]
keywords = ["fastapi", "framework", "file-based-routing", "nextjs", "api", "backend", "web", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "runapi/_version.py"

[tool.hatch.build.targets.sdist]
include = ["runapi", "runapi/py.typed", "README.md", "LICENSE", "pyproject.toml"]

[project.urls]
Homepage = "https://github.com/Amanbig/runapi"
Repository = "https://github.com/Amanbig/runapi"
Documentation = "https://github.com/Amanbig/runapi/tree/main/docs"
Issues = "https://github.com/Amanbig/runapi/issues"
Changelog = "https://github.com/Amanbig/runapi/tree/main/release-notes"

[project.optional-dependencies]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.19",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
lint = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
runapi = "runapi.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict parameter
    "UP006",  # keep typing.Dict/List style (typing style kept for now)
    "UP035",  # deprecated typing imports
    "UP007",  # Optional[X] -> X | None
    "UP045",  # Optional[X] -> X | None
]

[tool.ruff.lint.isort]
known-first-party = ["runapi"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]
